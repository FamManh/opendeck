services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opendeck
      POSTGRES_PASSWORD: opendeck
      POSTGRES_DB: opendeck
    ports:
      - "5433:5432"
    volumes:
      - opendeck-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendeck"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  opendeck-db:

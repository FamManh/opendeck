# OpenDeck — HTTP (port 80). HTTPS/443 sẽ do certbot (Let's Encrypt) thêm sau.
# Copy vào /etc/nginx/sites-available/opendeck.conf rồi symlink sang sites-enabled.

upstream opendeck_api {
    server 127.0.0.1:4445;
}

upstream opendeck_web {
    server 127.0.0.1:4444;
}

server {
    listen 80;

    server_name deck.viconsol.net;

    client_max_body_size 5m;

    # REST API
    location /api/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_max_temp_file_size 0;
        proxy_pass http://opendeck_api;
        proxy_redirect off;
        proxy_read_timeout 240s;
    }

    # Socket.IO (realtime cho phòng vote)
    location /socket.io/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://opendeck_api;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend (Vite build, chạy bằng `serve` qua pm2)
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_max_temp_file_size 0;
        proxy_pass http://opendeck_web;
        proxy_redirect off;
        proxy_read_timeout 240s;
    }
}

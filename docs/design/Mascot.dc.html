</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;species&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cat&quot;,&quot;capybara&quot;,&quot;robot&quot;,&quot;dino&quot;,&quot;owl&quot;,&quot;bunny&quot;,&quot;koala&quot;,&quot;fox&quot;],&quot;default&quot;:&quot;cat&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;thinking&quot;,&quot;voted&quot;,&quot;sleeping&quot;,&quot;celebrating&quot;,&quot;away&quot;],&quot;default&quot;:&quot;thinking&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const sp = this.props.species ?? 'cat';
    const st = this.props.state ?? 'thinking';
    return {
      isCat: sp === 'cat', isCapybara: sp === 'capybara', isRobot: sp === 'robot', isDino: sp === 'dino',
      isOwl: sp === 'owl', isBunny: sp === 'bunny', isKoala: sp === 'koala', isFox: sp === 'fox',
      isThinking: st === 'thinking', isVoted: st === 'voted', isSleeping: st === 'sleeping',
      isCelebrating: st === 'celebrating', isAway: st === 'away'
    };
  }
}
</script>
